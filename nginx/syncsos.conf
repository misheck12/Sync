# Host-level edge for marketing, the isolated modern demo, and platform Ops.
# Legacy school hosts and CRM continue to use the existing multi-tenant stack.
server {
    listen 80;
    server_name syncsos.com www.syncsos.com demo.syncsos.com;
    location ^~ /.well-known/acme-challenge/ {
        root /home/Misheck/app-mt/site-syncsos;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    server_name ops.syncsos.com;
    location ^~ /.well-known/acme-challenge/ {
        root /home/Misheck/app-mt/site-syncsos;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

# Retire only the old marketing name. Keep DNS and ACME HTTP validation for
# the shared bwangubwangu.net certificate used by other legacy hostnames.
server {
    listen 80;
    server_name sync.bwangubwangu.net;
    location / { return 410 'Marketing site moved to https://syncsos.com/'; }
}

server {
    listen 443 ssl;
    server_name sync.bwangubwangu.net;
    ssl_certificate /etc/letsencrypt/live/bwangubwangu.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bwangubwangu.net/privkey.pem;
    location / { return 410 'Marketing site moved to https://syncsos.com/'; }
}

server {
    listen 443 ssl;
    server_name www.syncsos.com;
    ssl_certificate /etc/letsencrypt/live/syncsos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syncsos.com/privkey.pem;
    return 301 https://syncsos.com$request_uri;
}

server {
    listen 443 ssl;
    server_name syncsos.com;
    ssl_certificate /etc/letsencrypt/live/syncsos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syncsos.com/privkey.pem;

    root /home/Misheck/app-mt/site-syncsos;
    index index.html;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/v1/website/pricing {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host syncsos.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/website/contact {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host syncsos.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Retain access to the existing authenticated platform/CRM APIs after
    # the old marketing hostname is retired. The backend enforces its roles.
    location ^~ /api/platform/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host syncsos.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(?:conf|env|pptx|bak|sql)$ { return 404; }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 443 ssl;
    server_name demo.syncsos.com;
    ssl_certificate /etc/letsencrypt/live/syncsos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syncsos.com/privkey.pem;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    client_max_body_size 10m;

    # The modern demo is isolated from legacy school and CRM databases.
    root /home/Misheck/app-mt/site-ops-login-20261020;
    index index.html;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 120s;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:4082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:4082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ { try_files $uri =404; expires 1y; }
    location = /sw.js { try_files $uri =404; expires -1; }
    location ~ /\. { return 404; }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}

server {
    listen 443 ssl;
    server_name ops.syncsos.com;
    ssl_certificate /etc/letsencrypt/live/ops.syncsos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.syncsos.com/privkey.pem;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    root /home/Misheck/app-mt/site-ops-login-20261020;
    index index.html;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 120s;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:4082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:4082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ { try_files $uri =404; expires 1y; }
    location = /sw.js { try_files $uri =404; expires -1; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
}