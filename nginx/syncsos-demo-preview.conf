# Isolated loopback-only preview of the latest school frontend.
# Never route public demo traffic here before validating backend contracts.
server {
    listen 127.0.0.1:5082;
    server_name localhost;
    root /home/Misheck/app-mt/site-demo-20261020;
    index index.html;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4082;
        proxy_set_header Host demo.syncsos.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:4082;
        proxy_set_header Host demo.syncsos.com;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ { try_files $uri =404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}