# Temporary HTTP-only virtual hosts for ACME webroot and new-site validation.
# Keep this file until certificates exist, then install syncsos.conf in its place.
server {
    listen 80;
    server_name syncsos.com www.syncsos.com;
    root /home/Misheck/app-mt/site-syncsos;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /home/Misheck/app-mt/site-syncsos;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /api/v1/website/pricing {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host sync.bwangubwangu.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/website/contact {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host sync.bwangubwangu.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(?:conf|env|pptx|bak|sql)$ { return 404; }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    server_name demo.syncsos.com;

    location ^~ /.well-known/acme-challenge/ {
        root /home/Misheck/app-mt/site-syncsos;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After 3600 always;
        return 503 'Demo tenant is being provisioned';
    }
}